<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login Premium - Taller Mecánico</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <style>
            :root {
                --primary-color: #ff0000; /* Rojo */
                --accent-color: #ffbf00; /* Amarillo/Dorado */
                --dark-color: #000000; /* Negro */
                --text-light: #ffffff;
                /* Transparencia ajustada para que se vea el fondo */
                --glass-bg: rgba(255, 191, 0, 0.25);
            }

            body {
                font-family: 'Poppins', sans-serif;
                /* Fondo alusivo a mecánica con superposición para mejorar contraste */
                background: linear-gradient(
                        rgba(0, 0, 0, 0.6),
                        rgba(0, 0, 0, 0.6)
                    ),
                    url('https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?q=80&w=1920&auto=format&fit=crop');
                background-size: cover;
                background-position: center;
                background-attachment: fixed;
                background-repeat: no-repeat;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                padding: 20px;
            }

            .login-card {
                background: var(--glass-bg);
                /* Glassmorphism reforzado */
                backdrop-filter: blur(15px);
                -webkit-backdrop-filter: blur(15px);
                padding: 40px;
                border-radius: 30px;
                box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
                text-align: center;
                width: 100%;
                max-width: 420px;
                border: 1px solid rgba(255, 255, 255, 0.3);
                animation: fadeIn 0.8s ease-out;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            h2 {
                color: var(
                    --text-light
                ); /* Cambiado a blanco para mejor contraste sobre transparente */
                margin: 0 0 30px 0;
                font-weight: 600;
                font-size: 28px;
                text-transform: uppercase;
                letter-spacing: 2px;
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            }

            .role-selector {
                display: flex;
                background-color: rgba(255, 255, 255, 0.2);
                border-radius: 15px;
                padding: 5px;
                margin-bottom: 35px;
                position: relative;
                box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2);
            }

            .role-selector::before {
                content: '';
                position: absolute;
                top: 5px;
                left: 5px;
                height: calc(100% - 10px);
                width: calc(50% - 5px);
                background-color: var(--dark-color);
                border-radius: 12px;
                transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
                z-index: 1;
            }

            .role-selector[data-active-role='admin']::before {
                left: calc(50% + 0px);
            }

            .role-button {
                flex: 1;
                padding: 12px;
                border: none;
                background: transparent;
                color: var(--text-light);
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                position: relative;
                z-index: 2;
                transition: color 0.3s;
            }

            .role-button.active {
                color: var(--accent-color);
            }

            .input-group {
                position: relative;
                margin-bottom: 25px;
            }

            .input-group i.main-icon {
                position: absolute;
                left: 15px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--dark-color);
                font-size: 18px;
                z-index: 3;
            }

            /* Botón para ver contraseña */
            .toggle-password {
                position: absolute;
                right: 15px;
                top: 50%;
                transform: translateY(-50%);
                cursor: pointer;
                color: var(--dark-color);
                font-size: 16px;
                z-index: 3;
                transition: color 0.2s;
            }

            .toggle-password:hover {
                color: var(--primary-color);
            }

            .input-group input {
                width: 100%;
                padding: 15px 45px 15px 45px;
                background: rgba(255, 255, 255, 0.85);
                border: 2px solid transparent;
                border-radius: 12px;
                font-size: 15px;
                outline: none;
                box-sizing: border-box;
                transition: all 0.3s;
            }

            .input-group input:focus {
                border-color: var(--primary-color);
                background: #ffffff;
                box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
            }

            .error-message {
                color: #ff4d4d;
                font-size: 12px;
                font-weight: 600;
                margin-top: 5px;
                display: block;
                text-align: left;
                min-height: 18px;
                text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            }

            button[type='submit'] {
                background: var(--dark-color);
                color: var(--text-light);
                padding: 15px;
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 12px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                width: 100%;
                margin-top: 10px;
                transition: all 0.3s;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            button[type='submit']:hover {
                background: var(--primary-color);
                transform: translateY(-3px);
                box-shadow: 0 8px 20px rgba(255, 0, 0, 0.3);
            }

            .forgot-password {
                display: inline-block;
                margin-top: 20px;
                color: var(--text-light);
                text-decoration: none;
                font-size: 14px;
                transition: color 0.3s;
                text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            }

            .forgot-password:hover {
                color: var(--accent-color);
            }

            .signup-link {
                margin-top: 25px;
                font-size: 14px;
                color: var(--text-light);
                border-top: 1px solid rgba(255, 255, 255, 0.2);
                padding-top: 20px;
            }

            .signup-link a {
                color: var(--accent-color);
                text-decoration: none;
                font-weight: 600;
            }

            .signup-link a:hover {
                text-decoration: underline;
            }

            @media (max-width: 480px) {
                .login-card {
                    padding: 30px 20px;
                }
            }
        </style>
    </head>
    <body>
        <div class="login-card">
            <div class="role-selector" data-active-role="user">
                <button
                    type="button"
                    class="role-button active"
                    data-role="clientes"
                >
                    Usuario
                </button>
                <button type="button" class="role-button" data-role="admin">
                    Administrador
                </button>
            </div>

            <h2>Bienvenido</h2>

            <form id="loginForm" novalidate>
                <!-- Email -->
                <div class="input-group">
                    <i class="fas fa-envelope main-icon"></i>
                    <input
                        type="email"
                        id="email"
                        placeholder="Correo electrónico"
                        autocomplete="email"
                    />
                    <span class="error-message" id="emailError"></span>
                </div>

                <!-- Password con botón de visualización -->
                <div class="input-group">
                    <i class="fas fa-lock main-icon"></i>
                    <input
                        type="password"
                        id="password"
                        placeholder="Contraseña"
                        autocomplete="current-password"
                    />
                    <i
                        class="fas fa-eye toggle-password"
                        id="togglePassword"
                    ></i>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <button type="submit" id="loginButton">
                    Acceder como Usuario
                </button>

                <a href="#" class="forgot-password"
                    >¿Olvidaste tu contraseña?</a
                >

                <p class="signup-link">
                    ¿No tienes cuenta?
                    <a href="#" id="signupLink">Regístrate aquí</a>
                </p>
            </form>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <script src="./login.js"></script>
    </body>
</html>
