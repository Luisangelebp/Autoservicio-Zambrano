<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Repuestos - Servicio Mecánico</title>
    <link rel="stylesheet" href="tienda.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <h1>Tienda de Repuestos</h1>
    </header>

    <main>
        <section id="productos">
            <h2>Nuestros Repuestos</h2>
            <div id="lista-productos">
                </div>
        </section>

        <aside id="resumen-compra">
            <h2>Tu Compra</h2>
            <div id="items-seleccionados">
                <p class="empty-cart-message">No has seleccionado ningún repuesto.</p>
            </div>
            <div class="total-section">
                <p>Total: <span id="total-compra">0.00</span> Bs.D</p>
            </div>
            <button id="btn-pagar" class="btn primary-btn" disabled><i class="fas fa-shopping-cart"></i> Proceder al Pago</button>
            <p id="mensaje-tienda" class="message" style="display:none;"></p>
            <button type="button" id="btnAtras" class="btn secondary-btn"><i class="fas fa-arrow-left"></i> Atrás</button>
        </aside>
    </main>
    </footer>
    <script src="tienda.js"></script>
</body>
</html>
