<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pagar - Servicio Mecánico</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        />
        <link rel="stylesheet" href="pago.css" />
    </head>
    <body>
        <main>
            <section id="selector">
                <div class="Titlecontainer">
                    <h2>Citas</h2>
                    <section class="container citaContainer"></section>
                </div>
                <div class="Titlecontainer">
                    <h2>Carrito</h2>
                    <section class="container carroContainer"></section>
                </div>
            </section>
            <aside id="pago">
                <h3>Metodo de Pago</h3>
                <div id="pago-info"></div>
                <div id="pago-buttons">
                    <button id="efectivo-btn">Efectivo</button>
                    <button id="tarjeta-btn">Tarjeta</button>
                    <button id="pago-movil-btn">Pago Movil</button>
                </div>
                <div id="pago-movil-info" style="display: none">
                    <p>banco: Venezuela</p>
                    <p>Telefono: 04140000000</p>
                    <p>cedula: V00000000</p>
                </div>
                <form id="pago-movil-form" style="display: none">
                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha" name="fecha" required />
                    <label for="referencia">Referencia:</label>
                    <input
                        type="text"
                        id="referencia"
                        name="referencia"
                        required
                    />
                    <label for="monto">Monto:</label>
                    <input
                        type="number"
                        id="monto"
                        name="monto"
                        step="any"
                        required
                    />
                    <label for="banco">Banco:</label>
                    <select id="banco" name="banco" required></select>
                    <button type="submit">Pagar</button>
                </form>
            </aside>
        </main>
        <button id="regresar-btn" class="floating-button">
            <i class="bi bi-arrow-left"></i>
        </button>

        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="pago.js"></script>
    </body>
</html>
