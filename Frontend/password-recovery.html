<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Recuperar Contraseña - Autoservicio Zambrano</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #ff0000;
            --accent-color: #ffbf00;
            --dark-color: #000000;
            --text-light: #ffffff;
            --glass-bg: rgba(0, 0, 0, 0.4); 
        }

        body {
            font-family: 'Poppins', sans-serif;
            /* Imagen alusiva a seguridad digital, candados y recuperación de cuenta */
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)), 
                        url('https://images.unsplash.com/photo-1633265486064-086b219458ec?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        main {
            /* Glassmorphism: Caja transparente y elegante */
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 40px;
            border-radius: 35px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeInScale 0.7s ease-out;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        header h1 {
            color: var(--text-light);
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 35px;
            text-align: center;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 15px;
            display: inline-block;
            width: 100%;
        }

        h2 {
            color: var(--text-light);
            font-size: 16px;
            margin-bottom: 25px;
            font-weight: 300;
            text-align: center;
            letter-spacing: 1px;
        }

        #selection-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option-btn {
            flex: 1;
            padding: 18px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: white;
            border-radius: 20px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .option-btn i {
            font-size: 24px;
            color: var(--accent-color);
        }

        .option-btn:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .option-btn.selected {
            background: var(--accent-color);
            color: var(--dark-color);
            border-color: var(--accent-color);
            box-shadow: 0 15px 30px rgba(255, 191, 0, 0.3);
        }

        .option-btn.selected i {
            color: var(--dark-color);
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 12px;
            color: var(--accent-color);
            text-transform: uppercase;
            font-weight: 600;
            padding-left: 5px;
        }

        .input-field {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s;
            color: white;
        }

        .input-field:focus {
            border-color: var(--accent-color);
            background: rgba(0,0,0,0.7);
            box-shadow: 0 0 15px rgba(255, 191, 0, 0.2);
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 15px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--accent-color);
            color: var(--dark-color);
        }

        .btn-primary:hover {
            background: #e6ac00;
            box-shadow: 0 10px 25px rgba(255,191,0,0.4);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            border-color: white;
        }

        .message {
            margin: 15px 0;
            padding: 15px;
            border-radius: 12px;
            font-size: 13px;
            display: none;
            text-align: center;
        }

        .message.success { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid #2ecc71; }
        .message.error { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #e74c3c; }

        footer {
            margin-top: 40px;
            text-align: center;
            color: rgba(255,255,255,0.4);
            font-size: 10px;
            letter-spacing: 2px;
        }

        #password-reset-section { display: none; }

    </style>
</head>
<body>

    <main>
        <header>
            <h1><i class="fas fa-user-shield"></i> Autoservicio Zambrano</h1>
        </header>

        <section id="recuperacion-opciones">
            <h2>Gestión de Seguridad</h2>
            
            <div id="selection-buttons">
                <button type="button" class="option-btn" id="emailBtn">
                    <i class="fas fa-paper-plane"></i>
                    <span>E-mail</span>
                </button>
                <button type="button" class="option-btn" id="phoneBtn">
                    <i class="fas fa-comment-dots"></i>
                    <span>SMS</span>
                </button>
            </div>

            <form id="recuperacion-form">
                <div id="dynamic-input">
                    <!-- Dinámico -->
                </div>
                <p id="recuperacionMessage" class="message"></p>
                
                <div class="btn-container">
                    <button type="submit" class="btn btn-primary" id="btnContinuar">Enviar Código</button>
                    <button type="button" class="btn btn-secondary" id="btnAtras">Regresar</button>
                </div>
            </form>
        </section>

        <section id="password-reset-section">
            <h2>Restablecer Llave</h2>
            <form id="reset-password-form">
                <div class="input-group">
                    <label>Nueva Contraseña</label>
                    <input type="password" id="new_password" class="input-field" placeholder="******" minlength="6" required>
                </div>
                <div class="input-group">
                    <label>Confirmar Entrada</label>
                    <input type="password" id="confirm_password" class="input-field" placeholder="******" minlength="6" required>
                </div>
                <p id="resetMessage" class="message"></p>
                
                <div class="btn-container">
                    <button type="submit" class="btn btn-primary">Confirmar Cambio</button>
                </div>
            </form>
        </section>

        <footer>
            <p>&copy; 2025 AUTOSERVICIO ZAMBRANO | DEPARTAMENTO TÉCNICO</p>
        </footer>
    </main>

    <script>
        const emailBtn = document.getElementById('emailBtn');
        const phoneBtn = document.getElementById('phoneBtn');
        const dynamicInputDiv = document.getElementById('dynamic-input');
        const recuperacionForm = document.getElementById('recuperacion-form');
        const recuperacionMessage = document.getElementById('recuperacionMessage');
        const btnAtras = document.getElementById('btnAtras');
        const recuperacionOpcionesSection = document.getElementById('recuperacion-opciones');
        const passwordResetSection = document.getElementById('password-reset-section');
        const resetPasswordForm = document.getElementById('reset-password-form');
        const newPasswordInput = document.getElementById('new_password');
        const confirmPasswordInput = document.getElementById('confirm_password');
        const resetMessage = document.getElementById('resetMessage');
        const btnContinuar = document.getElementById('btnContinuar');

        let selectedOption = null;

        function showMessage(element, message, type) {
            element.textContent = message;
            element.className = `message ${type}`;
            element.style.display = 'block';
        }

        emailBtn.addEventListener('click', () => {
            selectedOption = 'email';
            emailBtn.classList.add('selected');
            phoneBtn.classList.remove('selected');
            dynamicInputDiv.innerHTML = `
                <div class="input-group">
                    <label>Correo de recuperación</label>
                    <input type="email" id="email_identifier" class="input-field" placeholder="usuario@taller.com" required>
                </div>`;
            recuperacionMessage.style.display = 'none';
        });

        phoneBtn.addEventListener('click', () => {
            selectedOption = 'phone';
            phoneBtn.classList.add('selected');
            emailBtn.classList.remove('selected');
            dynamicInputDiv.innerHTML = `
                <div class="input-group">
                    <label>Teléfono registrado</label>
                    <input type="tel" id="phone_identifier" class="input-field" placeholder="Ej: 04141234567" maxlength="11" required>
                </div>`;
            
            const input = document.getElementById('phone_identifier');
            input.oninput = (e) => {
                e.target.value = e.target.value.replace(/\D/g, '').slice(0, 11);
            };
            recuperacionMessage.style.display = 'none';
        });

        recuperacionForm.addEventListener('submit', e => {
            e.preventDefault();

            if (!selectedOption) {
                showMessage(recuperacionMessage, 'Debes elegir un método de contacto.', 'error');
                return;
            }

            btnContinuar.disabled = true;
            btnContinuar.innerHTML = '<i class="fas fa-lock fa-spin"></i> Validando...';

            setTimeout(() => {
                showMessage(recuperacionMessage, `Código de seguridad enviado.`, 'success');
                setTimeout(() => {
                    recuperacionOpcionesSection.style.display = 'none';
                    passwordResetSection.style.display = 'block';
                }, 1500);
            }, 1500);
        });

        resetPasswordForm.addEventListener('submit', e => {
            e.preventDefault();
            if (newPasswordInput.value !== confirmPasswordInput.value) {
                showMessage(resetMessage, 'Las contraseñas no coinciden.', 'error');
                return;
            }

            showMessage(resetMessage, '¡Credenciales actualizadas!', 'success');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        });

        btnAtras.addEventListener('click', () => {
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
