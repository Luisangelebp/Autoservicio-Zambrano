<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ver Citas - Servicio Mecánico</title>
        <link rel="stylesheet" href="citas.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    </head>
    <body>
        <header>
            <h1>Ver Citas</h1>
        </header>

        <main>
            <section id="verCitas">
                <h2>Citas Agendadas</h2>
                <div class="filters-pagination-container">
                    <div class="filters">
                        <label for="filterStatus">Estado:</label>
                        <select id="filterStatus">
                            <option value="">Todos</option>
                            <option value="pendiente">Pendiente</option>
                            <option value="confirmada">Confirmada</option>
                            <option value="cancelada">Cancelada</option>
                            <option value="completada">Completada</option>
                        </select>

                        <label for="filterDate">Fecha:</label>
                        <input type="date" id="filterDate">
                    </div>
                    <div id="pagination" class="pagination"></div>
                </div>
                <div id="listaCitas" class="citas-grid">
                    <p class="empty-list-message">
                        No tienes citas agendadas aún.
                    </p>
                </div>
                <button type="button" id="btnAtras" class="btn secondary-btn">
                    <i class="fas fa-arrow-left"></i> Atrás
                </button>
            </section>
        </main>

        <!-- Modal para Asignar Monto -->
        <div id="montoModal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h2>Asignar Monto a Cita</h2>
                <input type="number" id="montoInput" placeholder="Ingrese el monto" min="0" step="0.01">
                <button id="saveMontoBtn" class="btn primary-btn">Guardar Monto</button>
            </div>
        </div>

        <footer>
            <p>&copy; 2025 AUTO SERVICIO ZAMBRANO</p>
        </footer>
        <script src="verCita.js"></script>
    </body>
</html>
