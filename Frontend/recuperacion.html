<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Recuperar Contraseña - Servicio Mecánico</title>
    <style>
        /* Estilos generales y de layout */
        body {
            font-family: Arial, sans-serif;
            margin: 0; /* Eliminar margen por defecto del body */
            padding: 20px;
            background-color: #0000006c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Ocupar al menos el 100% del alto de la ventana */
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }

        main {
            max-width: 450px; /* Aumentado un poco el ancho */
            width: 100%;
            margin: 0 auto;
            background-color: #00000033;
            padding: 30px; /* Aumentado el padding */
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1); /* Sombra más pronunciada */
            text-align: center; /* Centrar contenido del main */
        }

        h1, h2 {
            color: #000000;
            margin-bottom: 20px;
        }

        /* Estilos para los botones de selección */
        #selection-buttons {
            display: flex;
            justify-content: center; /* Centrar los botones */
            margin-bottom: 20px;
            gap: 10px; /* Espacio entre botones */
        }

        .option-btn {
            padding: 12px 25px; /* Más padding para que sean más grandes */
            cursor: pointer;
            border: 2px solid #0026ff;
            background-color: white;
            color: #007BFF;
            border-radius: 5px; /* Bordes un poco más suaves */
            transition: background-color 0.3s, color 0.3s, transform 0.2s; /* Añadir transform para hover */
            font-size: 1.1em; /* Texto un poco más grande */
        }
        .option-btn:hover {
            transform: translateY(-2px); /* Pequeño efecto al pasar el ratón */
        }
        .option-btn.selected {
            background-color: #007BFF;
            color: white;
            border-color: #0056b3; /* Borde más oscuro al seleccionar */
        }

        /* Estilo para los inputs */
        .input-group {
            margin-bottom: 15px; /* Espacio entre grupos de input */
            text-align: left; /* Alinea el label a la izquierda */
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #663333;
        }

        .input-field {
            width: 100%;
            padding: 12px; /* Más padding para los inputs */
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 1em;
        }
        .input-field:focus {
            border-color: #007BFF;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }

        /* Estilo para los botones de acción (Continuar, Atrás) */
        .btn {
            width: 30%;/*tamaño pa los botones*/
            padding: 10px;
            margin-top: 15px;
            background-color: #ffbb00;
            color: rgb(0, 0, 0);
            border: none;
            border-radius: 95px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #1eff00;/*color al colocar raton*/
        }

        #btnAtras {
            background-color: #ffbb00; /* Gris para acción secundaria */
        }
        #btnAtras:hover {
            background-color: #ff0000;
        }

        /* Estilos para el mensaje de estado */
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
            display: none; /* Oculto por defecto */
        }
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #c71829;
        }
        .message.info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        footer {
            margin-top: 30px; /* Más espacio para el footer */
            text-align: center;
            color: #000000;
            width: 100%;
        }

        /* Ocultar secciones inicialmente */
        #password-reset-section {
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Recuperar Contraseña</h1>
    </header>

    <main>
        <section id="recuperacion-opciones">
            <h2>Selecciona una opción de recuperación</h2>
            <div id="selection-buttons">
                <button type="button" class="option-btn" id="emailBtn">Email</button>
                <button type="button" class="option-btn" id="phoneBtn">Teléfono</button>
            </div>
            <form id="recuperacion-form">
                <div id="dynamic-input">
                    </div>
                <p id="recuperacionMessage" class="message"></p>
                <button type="submit" class="btn">Continuar</button>
                <button type="button" class="btn" id="btnAtras">Atrás</button>
            </form>
        </section>

        <section id="password-reset-section">
            <h2>Establecer Nueva Contraseña</h2>
            <form id="reset-password-form">
                <div class="input-group">
                    <label for="new_password">Nueva Contraseña:</label>
                    <input type="password" id="new_password" class="input-field" 
                           placeholder="Mínimo 6 caracteres" minlength="6" maxlength="12" required>
                </div>
                <div class="input-group">
                    <label for="confirm_password">Confirmar Contraseña:</label>
                    <input type="password" id="confirm_password" class="input-field" 
                           placeholder="Confirma tu nueva contraseña" minlength="6" maxlength="12" required>
                </div>
                <p id="resetMessage" class="message"></p>
                <button type="submit" class="btn">Cambiar Contraseña</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; AUTO SERVICIO ZAMBRANO</p>
    </footer>

    <script>
        // Referencias a elementos del DOM
        const emailBtn = document.getElementById('emailBtn');
        const phoneBtn = document.getElementById('phoneBtn');
        const dynamicInputDiv = document.getElementById('dynamic-input');
        const recuperacionForm = document.getElementById('recuperacion-form');
        const recuperacionMessage = document.getElementById('recuperacionMessage');
        const btnAtras = document.getElementById('btnAtras');

        const recuperacionOpcionesSection = document.getElementById('recuperacion-opciones');
        const passwordResetSection = document.getElementById('password-reset-section');
        const resetPasswordForm = document.getElementById('reset-password-form');
        const newPasswordInput = document.getElementById('new_password');
        const confirmPasswordInput = document.getElementById('confirm_password');
        const resetMessage = document.getElementById('resetMessage');

        let selectedOption = null; // Para guardar si se eligió email o teléfono
        let userIdentifier = ''; // Para guardar el email o teléfono ingresado

        // --- Funciones de Utilidad ---

        // Función para crear dinámicamente los campos de input
        function createInput(type, placeholder, id) {
            const input = document.createElement('input');
            input.type = type;
            input.placeholder = placeholder;
            input.id = id;
            input.className = 'input-field';
            input.required = true; // Todos los campos de identificación son requeridos

            if (type === 'tel') {
                input.maxLength = 11;
                // Expresión regular para permitir solo 11 dígitos
                input.pattern = '\\d{11}'; 
                input.title = 'Ingresa exactamente 11 dígitos numéricos.';
                input.inputmode = 'numeric'; // Optimizado para teclados numéricos en móviles
                input.oninput = () => {
                    // Limpiar caracteres no numéricos y limitar a 11
                    input.value = input.value.replace(/\D/g, '').slice(0, 11);
                };
            }
            return input;
        }

        // Función para mostrar mensajes al usuario
        const showMessage = (element, message, type) => {
            element.textContent = message;
            element.className = `message ${type}`;
            element.style.display = 'block';

            setTimeout(() => {
                element.style.display = 'none';
                element.textContent = '';
            }, 5000); // Mensaje visible por 5 segundos
        };

        // --- Event Listeners para Selección de Opción (Email/Teléfono) ---

        emailBtn.addEventListener('click', () => {
            selectedOption = 'email';
            emailBtn.classList.add('selected');
            phoneBtn.classList.remove('selected');
            dynamicInputDiv.innerHTML = '';
            const emailInput = createInput('email', 'Correo Electrónico', 'email_identifier');
            dynamicInputDiv.appendChild(emailInput);
            recuperacionMessage.style.display = 'none'; // Ocultar mensaje previo
        });

        phoneBtn.addEventListener('click', () => {
            selectedOption = 'phone';
            phoneBtn.classList.add('selected');
            emailBtn.classList.remove('selected');
            dynamicInputDiv.innerHTML = '';
            const phoneInput = createInput('tel', 'Número de Teléfono (11 dígitos)', 'phone_identifier');
            dynamicInputDiv.appendChild(phoneInput);
            recuperacionMessage.style.display = 'none'; // Ocultar mensaje previo
        });

        // --- Lógica del Formulario de Recuperación Inicial ---

        recuperacionForm.addEventListener('submit', e => {
            e.preventDefault();

            if (selectedOption === null) {
                showMessage(recuperacionMessage, 'Por favor, selecciona una opción (Email o Teléfono) para continuar.', 'error');
                return;
            }

            let identifierInput;
            if (selectedOption === 'email') {
                identifierInput = document.getElementById('email_identifier');
                userIdentifier = identifierInput ? identifierInput.value.trim() : '';
                if (!userIdentifier) {
                    showMessage(recuperacionMessage, 'Por favor, ingresa tu correo electrónico.', 'error');
                    return;
                }
                // Simulación: En un caso real, aquí se verificaría el email con el backend
                showMessage(recuperacionMessage, `Se ha enviado un código de recuperación a: ${userIdentifier}`, 'success');
                // Después de "enviar el código", mostrar la sección de cambio de contraseña
                setTimeout(() => {
                    recuperacionOpcionesSection.style.display = 'none';
                    passwordResetSection.style.display = 'block';
                    resetMessage.style.display = 'none'; // Limpiar mensajes previos en la nueva sección
                }, 2000); // Simular un pequeño retardo
            } else if (selectedOption === 'phone') {
                identifierInput = document.getElementById('phone_identifier');
                userIdentifier = identifierInput ? identifierInput.value.trim() : '';
                if (!userIdentifier) {
                    showMessage(recuperacionMessage, 'Por favor, ingresa tu número de teléfono.', 'error');
                    return;
                }
                // Validar que el teléfono tenga exactamente 11 dígitos
                if (userIdentifier.length !== 11 || !/^\d{11}$/.test(userIdentifier)) {
                    showMessage(recuperacionMessage, 'El número de teléfono debe contener exactamente 11 dígitos numéricos.', 'error');
                    return;
                }
                // Simulación: En un caso real, aquí se verificaría el teléfono con el backend
                showMessage(recuperacionMessage, `Se ha enviado un código de recuperación al teléfono: ${userIdentifier}`, 'success');
                // Después de "enviar el código", mostrar la sección de cambio de contraseña
                setTimeout(() => {
                    recuperacionOpcionesSection.style.display = 'none';
                    passwordResetSection.style.display = 'block';
                    resetMessage.style.display = 'none'; // Limpiar mensajes previos en la nueva sección
                }, 2000); // Simular un pequeño retardo
            }
        });

        // --- Lógica del Formulario de Restablecimiento de Contraseña ---

        resetPasswordForm.addEventListener('submit', e => {
            e.preventDefault();

            const newPassword = newPasswordInput.value.trim();
            const confirmPassword = confirmPasswordInput.value.trim();

            if (newPassword.length < 6 || newPassword.length > 12) {
                showMessage(resetMessage, 'La nueva contraseña debe tener entre 6 y 12 caracteres.', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage(resetMessage, 'Las contraseñas no coinciden.', 'error');
                return;
            }

            // Aquí iría la lógica real para cambiar la contraseña en el backend
            // Por ahora, simulamos el éxito
            showMessage(resetMessage, '¡Contraseña cambiada exitosamente!', 'success');

            // Después de cambiar la contraseña, redirigir al login o a otra página
            setTimeout(() => {
                window.location.href = 'login.html'; // Redirige a la página de login
            }, 3000); // Redirige después de 3 segundos
        });

        // --- Lógica del Botón "Atrás" ---
        btnAtras.addEventListener('click', () => {
            window.history.back(); // Regresa a la página anterior (probablemente login.html)
        });
    </script>
</body>
</html>
