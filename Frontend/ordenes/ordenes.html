<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="ordenes.css" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <title>Mis Órdenes</title>
    </head>
    <body>
        <header>
            <h1>Mis Órdenes</h1>
        </header>

        <div class="filters">
            <label for="entregado-filter">Estado:</label>
            <select id="entregado-filter">
                <option value="todas">Todas</option>
                <option value="entregado">Entregado</option>
                <option value="pendiente">Pendiente</option>
            </select>

            <label for="sort-by">Ordenar por:</label>
            <select id="sort-by">
                <option value="fecha-desc">Más recientes</option>
                <option value="fecha-asc">Más antiguas</option>
                <option value="monto-desc">Mayor monto</option>
                <option value="monto-asc">Menor monto</option>
            </select>
        </div>

        <main id="ordenes-container" class="ordenes-container"></main>

        <a href="../pg_principal suario.html" class="floating-button"
            ><i class="bi bi-arrow-left"></i
        ></a>

        <script src="ordenes.js"></script>
    </body>
</html>
